<title>Normalization Virtual Lab</title>
<meta name="description" content="Interactive normalization lab: closures, candidate keys, normal forms, 3NF and BCNF decomposition, chase test, quiz and GATE previous-year questions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout concept: a lab bench — a sticky input rail on the left, a graph-paper "dependency diagram" plate on top of the results.
   Display serif for headings, a highly legible sans for the UI, a mono face only for FD notation. Light is the default theme. */
:root {
  --paper: #f2f4f8;
  --sheet: #ffffff;
  --sheet-2: #f7f9fc;
  --ink: #142033;
  --ink-2: #4b5870;
  --ink-3: #6f7b90;
  --rule: #d6dde8;
  --rule-2: #e7ecf3;
  --grid: rgba(31, 79, 209, 0.07);
  --accent: #1f4fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e4ebfc;
  --ok: #15784b;  --ok-soft: #e1f3ea;
  --warn: #9a5a00; --warn-soft: #fbefdc;
  --bad: #bf3328;  --bad-soft: #fbe6e3;
  --prime: #6a44c0; --prime-soft: #efe9fb;
  --shadow: 0 1px 2px rgba(20, 32, 51, .06), 0 6px 20px rgba(20, 32, 51, .06);
  --f-display: 'Literata', 'Iowan Old Style', Georgia, serif;
  --f-ui: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r-s: 6px; --r-m: 10px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #0d131e;
  --sheet: #141c2a;
  --sheet-2: #182133;
  --ink: #e6ebf3;
  --ink-2: #a3afc3;
  --ink-3: #7f8ba1;
  --rule: #273246;
  --rule-2: #1f293b;
  --grid: rgba(126, 160, 255, 0.07);
  --accent: #82a3ff;
  --accent-ink: #0d131e;
  --accent-soft: #1c2947;
  --ok: #52c58f;  --ok-soft: #12301f;
  --warn: #f0ab50; --warn-soft: #36270f;
  --bad: #ff8073;  --bad-soft: #3a1915;
  --prime: #b9a2ff; --prime-soft: #261d42;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-ui); }
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -0.005em; }
h1 { font-size: 1.85rem; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
code, .mono { font-family: var(--f-mono); font-size: .92em; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: var(--r-s); z-index: 50; }
.skip:focus { left: 12px; }
.muted { color: var(--ink-2); }
.small { font-size: .86rem; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--sheet) 92%, transparent); backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--rule); }
.top-in { max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex-shrink: 0; }
.brand svg { width: 34px; height: 34px; }
.brand b { font-family: var(--f-display); font-size: 1.05rem; line-height: 1.1; display: block; }
.brand small { display: block; color: var(--ink-3); font-size: .74rem; letter-spacing: .02em; }
.nav { display: flex; gap: 2px; align-items: center; }
.nav a { text-decoration: none; color: var(--ink-2); padding: 7px 12px; border-radius: 999px; font-weight: 700; font-size: .93rem; white-space: nowrap; }
.nav a:hover { color: var(--ink); background: var(--sheet-2); }
.nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.util { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.util a { text-decoration: none; color: var(--ink-2); padding: 7px 10px; border-radius: 999px; font-size: .9rem; white-space: nowrap; }
.util a:hover { color: var(--ink); }
.util a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
.util a.learn { background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 7px 16px; }
.util a.learn[aria-current="page"] { text-decoration: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.theme-btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 5px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; color: var(--ink-2); }
.theme-btn svg { width: 16px; height: 16px; }
@media (max-width: 1080px) {
  .top-in { flex-wrap: wrap; gap: 8px 14px; padding-block: 8px; }
  .util { order: 2; }
  .nav { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; }
  .util a:not(.learn) { padding: 6px 7px; }
}
@media (max-width: 560px) {
  .brand small { display: none; }
  .util { margin-left: 0; width: 100%; overflow-x: auto; }
}

/* ---------- shell ---------- */
main { max-width: 1320px; margin: 0 auto; padding: 22px 20px 64px; }
.view-head { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
.view-head p { max-width: 68ch; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-m); }
.pad { padding: 18px 20px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: var(--r-s); padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: .92rem; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: .84rem; }
label.lbl { font-weight: 700; font-size: .88rem; display: block; margin-bottom: 6px; }
.field { width: 100%; border: 1px solid var(--rule); background: var(--sheet-2); border-radius: var(--r-s); padding: 9px 11px; }
textarea.field { font-family: var(--f-mono); font-size: .9rem; line-height: 1.6; resize: vertical; min-height: 120px; }
input.field.mono { font-family: var(--f-mono); font-size: .92rem; }
.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hint { color: var(--ink-3); font-size: .82rem; margin-top: 5px; }
.err { color: var(--bad); font-size: .86rem; display: flex; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .8rem; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.prime { background: var(--prime-soft); color: var(--prime); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip.line { border-color: var(--rule); color: var(--ink-2); background: var(--sheet); }
.fd { font-family: var(--f-mono); font-size: .9rem; white-space: nowrap; }
.set { font-family: var(--f-mono); }
table.t { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.t th { text-align: left; font-size: .8rem; color: var(--ink-3); font-weight: 700; padding: 6px 10px; border-bottom: 1px solid var(--rule); }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--rule-2); vertical-align: top; }
.scroll-x { overflow-x: auto; }
.empty { padding: 28px; text-align: center; color: var(--ink-2); }

/* ---------- lab ---------- */
.lab { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.rail .panel { padding: 16px; }
.rail-facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: .88rem; margin-top: 2px; }
.rail-facts dt { color: var(--ink-3); }
.rail-facts dd { margin: 0; font-family: var(--f-mono); word-break: break-word; }
@media (max-width: 900px) { .lab { grid-template-columns: minmax(0, 1fr); } .rail { position: static; } }

.plate { background-color: var(--sheet); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 16px 16px; border: 1px solid var(--rule); border-radius: var(--r-m); padding: 16px 18px 12px; }
.plate-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.plate-head h2 { font-size: 1.15rem; }
.diagram { overflow-x: auto; padding-bottom: 4px; }
.diagram svg { display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

.ladder { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin: 16px 0 6px; }
.rung { border: 1px solid var(--rule); border-radius: var(--r-s); padding: 8px 10px 9px; background: var(--sheet); position: relative; min-width: 0; }
.rung b { display: block; font-family: var(--f-display); font-size: 1.05rem; }
.rung span { font-size: .76rem; color: var(--ink-3); }
.rung.pass { background: var(--ok-soft); border-color: transparent; }
.rung.pass b { color: var(--ok); }
.rung.top { box-shadow: inset 0 0 0 2px var(--ok); }
.rung.fail { background: var(--bad-soft); border-color: transparent; }
.rung.fail b { color: var(--bad); }
.rung.na { opacity: .55; }
@media (max-width: 640px) { .ladder { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.verdict { font-size: .95rem; margin-top: 4px; }
.verdict strong { font-family: var(--f-display); }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 14px; }
.fact { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-s); padding: 10px 12px; min-width: 0; }
.fact span { display: block; font-size: .78rem; color: var(--ink-3); }
.fact b { font-family: var(--f-mono); font-weight: 600; font-size: .95rem; word-break: break-word; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin-top: 20px; overflow-x: auto; scrollbar-width: thin; }
.tabs [role="tab"] { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 700; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: .93rem; }
.tabs [role="tab"][aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabpanel { padding: 18px 2px 4px; }
.tabpanel h3 { margin-bottom: 8px; }
.tabpanel .lead { color: var(--ink-2); max-width: 75ch; margin-bottom: 12px; }

.proof { counter-reset: step; list-style: none; padding: 0; margin: 8px 0; display: flex; flex-direction: column; gap: 4px; }
.proof li { counter-increment: step; display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: var(--r-s); background: var(--sheet-2); font-size: .9rem; }
.proof li::before { content: counter(step); font-family: var(--f-mono); color: var(--ink-3); font-size: .8rem; text-align: right; }
.proof .why { color: var(--ink-3); font-size: .82rem; }
.picker { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.picker button { font-family: var(--f-mono); border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-s); padding: 4px 10px; cursor: pointer; font-size: .9rem; }
.picker button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.result-line { font-family: var(--f-mono); font-size: 1rem; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--r-s) var(--r-s) 0; margin: 8px 0; word-break: break-word; }
.stage { border: 1px solid var(--rule); border-radius: var(--r-s); padding: 12px 14px; margin-bottom: 10px; background: var(--sheet); }
.stage h4 { font-family: var(--f-ui); font-size: .95rem; margin-bottom: 6px; }
.fdlist { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.notes { margin: 8px 0 0; padding-left: 18px; font-size: .86rem; color: var(--ink-2); }
.tree { list-style: none; padding-left: 0; margin: 6px 0; }
.tree ul { list-style: none; padding-left: 22px; border-left: 1px dashed var(--rule); margin-left: 8px; }
.tree li { margin: 6px 0; }
.node { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 5px 10px; border-radius: var(--r-s); border: 1px solid var(--rule); background: var(--sheet); font-size: .9rem; }
.node.leaf { border-color: var(--ok); }
.tableau td, .tableau th { text-align: center; font-family: var(--f-mono); min-width: 44px; }
.tableau td.a { color: var(--ok); font-weight: 600; }
.tableau td.b { color: var(--ink-3); }
.tableau td.chg { background: var(--warn-soft); }
.tableau tr.full td { background: var(--ok-soft); }
.split2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.callout { border-radius: var(--r-s); padding: 10px 14px; font-size: .92rem; }
.callout.ok { background: var(--ok-soft); color: var(--ok); }
.callout.bad { background: var(--bad-soft); color: var(--bad); }
.callout.warn { background: var(--warn-soft); color: var(--warn); }
.callout.info { background: var(--accent-soft); color: var(--ink); }
.stale { opacity: .45; pointer-events: none; }

/* ---------- quiz + pyq shared ---------- */
.q-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-m); padding: 18px 20px; }
.q-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.q-stem { white-space: pre-line; font-size: 1rem; max-width: 80ch; }
.q-stem .fd { white-space: normal; }
.opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.opt { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; border: 1px solid var(--rule); border-radius: var(--r-s); padding: 9px 12px; cursor: pointer; background: var(--sheet); }
.opt:hover { border-color: var(--ink-3); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .key { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--rule); display: grid; place-items: center; font-size: .78rem; font-weight: 700; color: var(--ink-2); }
.opt.msq .key { border-radius: 5px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.locked { cursor: default; }
.opt-text { min-width: 0; overflow-wrap: anywhere; }
.nat { max-width: 200px; }
.solution { border-top: 1px solid var(--rule); margin-top: 14px; padding-top: 12px; }
.solution ul { margin: 6px 0 0; padding-left: 20px; }
.solution li { margin: 4px 0; }
.feedback { font-weight: 700; display: flex; gap: 8px; align-items: center; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }

.quiz-grid { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .quiz-grid { grid-template-columns: minmax(0, 1fr); } }
.palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.palette button { aspect-ratio: 1; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-s); cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums; }
.palette button.ans { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.palette button.cur { box-shadow: 0 0 0 2px var(--ink); }
.palette button.mark { border-style: dashed; border-color: var(--prime); }
.timer { font-family: var(--f-mono); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 700; font-size: .9rem; margin-bottom: 8px; padding: 0; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r-s); overflow: hidden; flex-wrap: wrap; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; padding: 7px 12px; font-size: .88rem; font-weight: 700; color: var(--ink-2); border-right: 1px solid var(--rule); }
.seg label:last-child span { border-right: 0; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.checks { display: flex; flex-direction: column; gap: 6px; }
.checks label { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: .92rem; }
.checks input { accent-color: var(--accent); width: 16px; height: 16px; }
.score-big { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 140px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: .86rem; }
.bar .track { height: 10px; background: var(--rule-2); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 5px; }

.pyq-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; margin-bottom: 18px; }
@media (max-width: 960px) { .pyq-top { grid-template-columns: minmax(0, 1fr); } }
.stat-row { display: flex; flex-wrap: wrap; gap: 22px; }
.stat b { display: block; font-family: var(--f-display); font-size: 1.7rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--ink-3); }
.progress { height: 8px; background: var(--rule-2); border-radius: 4px; overflow: hidden; margin-top: 14px; display: flex; }
.progress i { display: block; height: 100%; }
.matrix svg { display: block; width: 100%; height: auto; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 14px; margin-bottom: 14px; }
.filters select, .filters input { border: 1px solid var(--rule); background: var(--sheet-2); border-radius: var(--r-s); padding: 6px 9px; font-size: .9rem; }
.filters input[type="search"] { min-width: 200px; flex: 1; }
.tagbtn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 4px 11px; font-size: .84rem; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.tagbtn[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.pyq-list { display: flex; flex-direction: column; gap: 14px; }
.bm { background: none; border: 0; cursor: pointer; color: var(--ink-3); padding: 4px; margin-left: auto; }
.bm[aria-pressed="true"] { color: var(--warn); }
.bm svg { width: 18px; height: 18px; display: block; }

/* ---------- learn / help ---------- */
.doc { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 900px) { .doc { grid-template-columns: minmax(0, 1fr); } .toc { position: static !important; } }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); font-size: .9rem; }
.toc ol { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.toc a { display: block; text-decoration: none; color: var(--ink-2); padding: 5px 10px; border-left: 2px solid var(--rule); }

<script>
/* ---- engine.js ---- */
/* Normalization engine — pure functions, no DOM. Works in the browser (window.NF) and Node (module.exports).
   Attribute sets are bitmasks over the relation's attribute list (max 16 attributes for exhaustive searches). */
(function (root) {
  'use strict';

  const MAX_ATTRS = 16;
  const pop = (m) => { let c = 0; while (m) { m &= m - 1; c++; } return c; };
  const bits = (m) => { const r = []; for (let i = 0; m; i++, m >>>= 1) if (m & 1) r.push(i); return r; };
  const sub = (a, b) => (a & b) === a;               // a ⊆ b
  const psub = (a, b) => sub(a, b) && a !== b;       // a ⊂ b

  /* ---------- naming ---------- */
  function namer(attrs) {
    const single = attrs.every((a) => a.length === 1);
    const fn = (m) => {
      const xs = bits(m).map((i) => attrs[i]);
      if (!xs.length) return '∅';
      return single ? xs.join('') : xs.join(', ');
    };
    fn.single = single;
    fn.set = (m) => { const s = fn(m); return single ? s : '{' + s + '}'; };
    fn.fd = (fd, arrow) => fn(fd.lhs) + ' ' + (arrow || '→') + ' ' + fn(fd.rhs);
    fn.list = (ms) => ms.map(fn.set).join(', ');
    return fn;
  }

  /* ---------- parsing ---------- */
  const ARROW_MVD = /->>|→→|↠|-»/;
  const ARROW_FD = /->|→|=>/;

  function splitTokens(s) {
    return s.split(/[\s,;{}()]+/).map((t) => t.trim()).filter(Boolean);
  }

  function parseSchema(text) {
    const t = (text || '').trim();
    if (!t) return { error: 'Enter a relation, for example R(A, B, C, D).' };
    let name = 'R', body = t;
    const m = t.match(/^\s*([A-Za-z_][\w]*)\s*\((.*)\)\s*$/s);
    if (m) { name = m[1]; body = m[2]; }
    let attrs = splitTokens(body);
    // "ABCD" shorthand
    if (attrs.length === 1 && attrs[0].length > 1 && /^[A-Z]+$/.test(attrs[0])) attrs = attrs[0].split('');
    const seen = new Set();
    for (const a of attrs) {
      if (!/^[A-Za-z_][\w']*$/.test(a)) return { error: `“${a}” is not a valid attribute name. Use letters, digits and underscores.` };
      if (seen.has(a)) return { error: `Attribute “${a}” appears twice.` };
      seen.add(a);
    }
    if (attrs.length < 2) return { error: 'A relation needs at least two attributes.' };
    if (attrs.length > MAX_ATTRS) return { error: `This lab handles up to ${MAX_ATTRS} attributes (key search is exponential). You entered ${attrs.length}.` };
    return { name, attrs };
  }

  function parseSide(side, attrs, idx) {
    let mask = 0; const unknown = [];
    for (const tok of splitTokens(side)) {
      if (idx.has(tok)) { mask |= 1 << idx.get(tok); continue; }
      // concatenated single-letter shorthand, e.g. "AB"
      if (tok.split('').every((c) => idx.has(c))) { for (const c of tok) mask |= 1 << idx.get(c); continue; }
      unknown.push(tok);
    }
    return { mask, unknown };
  }

  function parseDeps(text, attrs) {
    const idx = new Map(attrs.map((a, i) => [a, i]));
    const fds = [], mvds = [], errors = [];
    const lines = (text || '').split(/\n/);
    lines.forEach((raw, li) => {
      const line = raw.replace(/#.*$/, '').replace(/\/\/.*$/, '').trim();
      if (!line) return;
      // allow several deps on one line separated by ';'
      line.split(';').map((s) => s.trim()).filter(Boolean).forEach((part) => {
        const isMvd = ARROW_MVD.test(part);
        const pieces = part.split(isMvd ? ARROW_MVD : ARROW_FD);
        if (pieces.length !== 2) { errors.push({ line: li + 1, msg: `Line ${li + 1}: write a dependency as X -> Y (or X ->> Y for a multivalued one).` }); return; }
        const L = parseSide(pieces[0], attrs, idx), R = parseSide(pieces[1], attrs, idx);
        const unk = L.unknown.concat(R.unknown);
        if (unk.length) { errors.push({ line: li + 1, msg: `Line ${li + 1}: ${unk.map((u) => '“' + u + '”').join(', ')} ${unk.length > 1 ? 'are' : 'is'} not in the relation.` }); return; }
        if (!L.mask) { errors.push({ line: li + 1, msg: `Line ${li + 1}: the left side is empty.` }); return; }
        if (!R.mask) { errors.push({ line: li + 1, msg: `Line ${li + 1}: the right side is empty.` }); return; }
        (isMvd ? mvds : fds).push({ lhs: L.mask, rhs: R.mask, line: li + 1 });
      });
    });
    return { fds, mvds, errors };
  }

  function parseDecomposition(text, attrs) {
    const idx = new Map(attrs.map((a, i) => [a, i]));
    const parts = []; const errors = [];
    // accepts "R1(A,B), R2(B,C)" or one relation per line "AB" / "A,B"
    let chunks = [];
    const re = /([A-Za-z_]\w*)?\s*\(([^)]*)\)/g; let m; let found = false;
    while ((m = re.exec(text))) { found = true; chunks.push({ name: m[1] || '', body: m[2] }); }
    if (!found) chunks = text.split(/\n|;|\|/).map((s) => s.trim()).filter(Boolean).map((b) => ({ name: '', body: b }));
    chunks.forEach((c, i) => {
      const r = parseSide(c.body, attrs, idx);
      if (r.unknown.length) errors.push(`Relation ${i + 1}: ${r.unknown.join(', ')} not in the schema.`);
      else if (!r.mask) errors.push(`Relation ${i + 1} is empty.`);
      else parts.push({ name: c.name || 'R' + (i + 1), mask: r.mask });
    });
    return { parts, errors };
  }

  /* ---------- closure ---------- */
  function closure(start, fds, wantTrace) {
    let x = start; const steps = [];
    let changed = true; let pass = 0;
    while (changed) {
      changed = false; pass++;
      for (const fd of fds) {
        if (sub(fd.lhs, x) && !sub(fd.rhs, x)) {
          const added = fd.rhs & ~x; x |= fd.rhs; changed = true;
          if (wantTrace) steps.push({ fd, added, result: x, pass });
        }
      }
    }
    return wantTrace ? { mask: x, steps } : x;
  }

  const implies = (fds, lhs, rhs) => sub(rhs, closure(lhs, fds));
  const equivalent = (F, G) => F.every((f) => implies(G, f.lhs, f.rhs)) && G.every((g) => implies(F, g.lhs, g.rhs));
  const isTrivial = (fd) => sub(fd.rhs, fd.lhs);

  /* ---------- keys ---------- */
  function candidateKeys(all, fds) {
    let rhsU = 0, lhsU = 0;
    fds.forEach((f) => { rhsU |= f.rhs & ~f.lhs; lhsU |= f.lhs; });
    const core = all & ~rhsU;                 // never derived: in every key
    const middle = all & rhsU & lhsU;         // may or may not be in a key
    if (closure(core, fds) === all) return { keys: [core], core, middle: 0, rhsOnly: all & ~core };
    const mids = bits(middle);
    const keys = [];
    const subsets = [];
    for (let s = 1; s < 1 << mids.length; s++) subsets.push(s);
    subsets.sort((a, b) => pop(a) - pop(b) || a - b);
    for (const s of subsets) {
      let m = core; mids.forEach((b, i) => { if (s & (1 << i)) m |= 1 << b; });
      if (keys.some((k) => sub(k, m))) continue;
      if (closure(m, fds) === all) keys.push(m);
    }
    keys.sort((a, b) => pop(a) - pop(b) || a - b);
    return { keys, core, middle, rhsOnly: all & ~core & ~middle };
  }

  function countSuperkeys(all, fds) {
    const n = bits(all).length; let c = 0;
    for (let m = 1; m <= all; m++) if (sub(m, all) && closure(m, fds) === all) c++;
    return n <= MAX_ATTRS ? c : NaN;
  }
  // superkeys from a known list of candidate keys (inclusion–exclusion by enumeration)
  function countSuperkeysFromKeys(n, keys) {
    let c = 0; for (let m = 1; m < 1 << n; m++) if (keys.some((k) => sub(k, m))) c++; return c;
  }

  /* ---------- covers ---------- */
  function minimalCover(fds) {
    const stages = [];
    // 1. split right sides
    let F = [];
    fds.forEach((f) => bits(f.rhs & ~f.lhs).forEach((b) => F.push({ lhs: f.lhs, rhs: 1 << b, from: f })));
    // dedupe
    F = F.filter((f, i) => F.findIndex((g) => g.lhs === f.lhs && g.rhs === f.rhs) === i);
    const dropped = fds.filter((f) => isTrivial(f));
    stages.push({ title: 'Split every right-hand side into single attributes', fds: F.slice(), notes: dropped.map((f) => ({ kind: 'trivial', fd: f })) });
    // 2. remove extraneous LHS attributes
    const notes2 = [];
    F = F.map((f) => {
      let lhs = f.lhs;
      for (const b of bits(f.lhs)) {
        const smaller = lhs & ~(1 << b);
        if (smaller && implies(F, smaller, f.rhs)) { notes2.push({ kind: 'extraneous', attr: b, before: { lhs, rhs: f.rhs }, after: { lhs: smaller, rhs: f.rhs } }); lhs = smaller; }
      }

/* Core helpers, storage, theme, router */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('nvl:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nvl:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep in memory */ } }
};
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const fmtTime = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

/* theme: light by default, night mode only when chosen */

/* router: one view at a time, chosen by #hash */
const VIEWS = ['lab', 'tables', 'quiz', 'pyq', 'learn', 'help', 'team', 'download'];
const RENDER = {};
let currentView = null;
function route() {
  let v = (location.hash || '#lab').slice(1).split('/')[0];
  if (!VIEWS.includes(v)) v = 'lab';
  $$('[data-nav]').forEach((a) => a.setAttribute('aria-current', a.dataset.nav === v ? 'page' : 'false'));
  VIEWS.forEach((name) => { const el = document.getElementById('view-' + name); if (el) el.hidden = name !== v; });
  if (currentView !== v) { currentView = v; window.scrollTo(0, 0); }
  if (RENDER[v]) RENDER[v]();
  const titles = { lab: 'Lab', tables: 'Tables', quiz: 'Quiz', pyq: 'Previous year questions', learn: 'Learn', help: 'Help', team: 'Developed by', download: 'Download' };
  document.title = 'Normalization Virtual Lab · ' + titles[v];
}

/* shared: render a question card (quiz + PYQ) */
function optionHTML(q, i, state) {
  const sel = state.picked && (q.type === 'msq' ? state.picked.includes(i) : state.picked === i);
  let cls = 'opt' + (q.type === 'msq' ? ' msq' : '') + (sel ? ' sel' : '');
  if (state.revealed) {
    const right = q.type === 'msq' ? q.answer.includes(i) : q.answer === i;
    cls += ' locked' + (right ? ' right' : sel ? ' wrong' : '');
  }
  return `<label class="${cls}" data-opt="${i}"><input type="${q.type === 'msq' ? 'checkbox' : 'radio'}" name="${esc(state.name)}" value="${i}" ${sel ? 'checked' : ''} ${state.revealed ? 'disabled' : ''}>
    <span class="key" aria-hidden="true">${LETTERS[i]}</span><span class="opt-text">${esc(q.options[i])}</span></label>`;
}
function isCorrect(q, picked) {
  if (q.type === 'nat') return picked !== '' && picked != null && Math.abs(Number(picked) - q.answer) < 1e-9;
  if (q.type === 'msq') return Array.isArray(picked) && picked.length === q.answer.length && q.answer.every((a) => picked.includes(a));
  return picked === q.answer;
}
function answerText(q) {
  if (q.type === 'nat') return String(q.answer);
  if (q.type === 'msq') return q.answer.map((i) => LETTERS[i]).join(', ');
  return LETTERS[q.answer];
}
function qTableHTML(q) { return q.table ? `<div class="q-table">${dataTable(q.table.cols, q.table.rows, { limit: 20 })}</div>` : ''; }
function typeLabel(t) { return { mcq: 'Single answer', msq: 'One or more answers', nat: 'Numerical answer' }[t]; }

/* file saving: the artifact viewer offers a mediated save, a normal website uses a link */

  if (!downloadsProbe) {
    const ask = window.claude && window.claude.use ? Promise.resolve().then(() => window.claude.use('downloads')) : Promise.resolve(null);
    const giveUp = new Promise((res) => setTimeout(() => res(null), 3000)); // never let a silent viewer block the save
    downloadsProbe = Promise.race([ask, giveUp]).then((d) => (downloadsApi = d && typeof d.save === 'function' ? d : null)).catch(() => (downloadsApi = null));
  }
  return downloadsProbe;
}
async function saveFile(filename, data, mime) {
  await probeDownloads();
  if (downloadsApi) {
    const ALLOWED = /\.(gif|png|jpe?g|webp|mp4|webm|txt|json|md|docx|pptx|epub|csv|ttf|html|svg|pdf|xlsx|zip)$/i;
    if (!ALLOWED.test(filename)) filename += '.txt'; // this viewer only saves listed types; .sql goes out as .sql.txt
    try { await downloadsApi.save({ filename, data: data instanceof Blob ? data : new Blob([data], { type: mime }) }); toast('Saved ' + filename); }
    catch (e) { if (e && e.code === 'declined') toast('Save cancelled'); else toast('This viewer could not save the file (' + (e && e.code || 'error') + ').'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Downloading ' + filename);
}

    deps: 'pnr -> train_no, journey_date\ntrain_no -> train_name\npnr, passenger -> age, coach, berth\ntrain_no, journey_date, coach, berth -> pnr, passenger' },
  { id: 'emp', name: 'Employee and department (transitive dependency)', schema: 'Employee(emp_id, emp_name, dept_id, dept_name, dept_city)',
    deps: 'emp_id -> emp_name, dept_id\ndept_id -> dept_name, dept_city' },
  { id: 'abcde', name: 'Textbook R(A,B,C,D,E) with four keys', schema: 'R(A, B, C, D, E)', deps: 'A -> B, C\nC, D -> E\nB -> D\nE -> A' },
  { id: '3nf', name: '3NF but not BCNF', schema: 'R(A, B, C)', deps: 'A, B -> C\nC -> B' },
  { id: 'mvd', name: 'Course, teacher, book (multivalued, 4NF)', schema: 'Offering(course, teacher, book)', deps: 'course ->> teacher\ncourse ->> book' },
  { id: 'g13', name: 'GATE 2013 relation R(A…H)', schema: 'R(A, B, C, D, E, F, G, H)', deps: 'C, H -> G\nA -> B, C\nB -> C, F, H\nE -> A\nF -> E, G' },
  { id: 'g21', name: 'GATE 2021 decomposition check', schema: 'R(P, Q, S, T, X, Y, Z, W)', deps: 'P, Q -> X\nP -> Y, X\nQ -> Y\nY -> Z, W', decomp: '(P,Q,S,T), (P,T,X), (Q,Y), (Y,Z,W)' }
];

const LAB = {
  schema: store.get('lab.schema', EXAMPLES[0].schema),
  deps: store.get('lab.deps', EXAMPLES[0].deps),
  decomp: store.get('lab.decomp', ''),
  tab: store.get('lab.tab', 'nf'),
  closureSel: 0,
  chaseStep: null,
  result: null,
  built: false
};

function labCompute() {
  const s = NF.parseSchema(LAB.schema);
  if (s.error) return { error: [s.error] };
  const d = NF.parseDeps(LAB.deps, s.attrs);
  if (d.errors.length) return { error: d.errors.map((e) => e.msg), attrs: s.attrs };
  if (!d.fds.length && !d.mvds.length) return { error: ['Add at least one dependency, for example A -> B.'], attrs: s.attrs };
  const out = buildRelation(s.name, s.attrs, d.fds, d.mvds);
  const { all, fds } = out;
  if (LAB.decomp.trim()) {
    const p = NF.parseDecomposition(LAB.decomp, s.attrs);
    out.decomp = p;
    if (!p.errors.length && p.parts.length) {
      out.chase = NF.chase(all, p.parts, fds, out.mvds);
      out.pres = NF.preservation(p.parts, fds);
      out.partNF = p.parts.map((pt) => { const pf = NF.project(fds, pt.mask); return { ...pt, fds: pf, an: NF.analyse(pt.mask, pf) }; });
    }
  }
  return out;
}

/* Full analysis of a schema; shared by the Lab, the Tables page and the reports. */
function buildRelation(name, attrs, fds, mvds) {
  mvds = mvds || [];
  const all = (1 << attrs.length) - 1;
  const n = NF.namer(attrs);
  const A = NF.analyse(all, fds, mvds);
  const K = NF.candidateKeys(all, fds);
  const out = { name, attrs, all, n, fds, mvds, A, K };
  out.superkeys = NF.countSuperkeys(all, fds);
  out.cover = NF.minimalCover(fds);
  out.canon = NF.canonicalCover(fds);
  out.syn = NF.synthesize3NF(all, fds);
  out.bcnf = NF.decomposeBCNF(all, fds, mvds.length ? mvds : null);
  const testParts = (rels) => ({ lossless: NF.chase(all, rels, fds, mvds).lossless, pres: NF.preservation(rels, fds) });
  out.synProps = testParts(out.syn.relations);
  out.bcnfProps = testParts(out.bcnf.relations);
  return out;
}

/* ---------- dependency diagram (the lab's signature figure) ---------- */
const KIND = {
  bcnf: { color: 'var(--accent)', label: 'Determinant is a superkey' },
  '3nf': { color: 'var(--prime)', label: 'Right side prime (3NF ok, breaks BCNF)' },
  partial: { color: 'var(--warn)', label: 'Partial dependency (breaks 2NF)' },
  transitive: { color: 'var(--bad)', label: 'Transitive dependency (breaks 3NF)' },
  mvd: { color: 'var(--ink-2)', label: 'Multivalued dependency' }
};
const RANK = { bcnf: 0, '3nf': 1, transitive: 2, partial: 3 };
function fdKind(R, fd) {
  // worst kind among the FD's single-attribute parts
  let worst = 'bcnf';
  R.A.rows.filter((r) => r.fd.line === fd.line && r.fd.lhs === fd.lhs && NF.sub(r.fd.rhs, fd.rhs)).forEach((r) => { if (RANK[r.kind] > RANK[worst]) worst = r.kind; });
  return worst;
}
function diagramSVG(R, opts = {}) {
  const { attrs } = R; const forPrint = opts.print;
  const cw = 8.2, gap = 12, boxH = 34, top = 6;
  const widths = attrs.map((a) => Math.max(44, Math.round(a.length * cw + 24)));
  const xs = []; let x = 4; widths.forEach((w) => { xs.push(x); x += w + gap; });
  const totalW = x - gap + 4;
  const cx = (i) => xs[i] + widths[i] / 2;
  const deps = R.fds.map((f) => ({ ...f, kind: fdKind(R, f) })).concat(R.mvds.map((m) => ({ ...m, kind: 'mvd' })));
  const lvl0 = top + boxH + 20, step = 20;
  const H = lvl0 + Math.max(1, deps.length) * step + 6;
  const W = totalW + 120;
  const firstKey = R.A.keys[0] || 0;
  const col = (v) => (forPrint ? ({ 'var(--accent)': '#1f4fd1', 'var(--prime)': '#6a44c0', 'var(--warn)': '#9a5a00', 'var(--bad)': '#bf3328', 'var(--ink-2)': '#4b5870', 'var(--ink)': '#142033', 'var(--sheet)': '#ffffff', 'var(--prime-soft)': '#efe9fb', 'var(--rule)': '#c9d2df', 'var(--ink-3)': '#6f7b90' }[v] || v) : v);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dependency diagram for ${esc(R.name)}" font-family="IBM Plex Mono, ui-monospace, monospace">`;
  s += `<defs>${Object.entries(KIND).map(([k, v]) => `<marker id="ah-${k}${forPrint ? 'p' : ''}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="${col(v.color)}"/></marker>`).join('')}</defs>`;
  attrs.forEach((a, i) => {
    const prime = (R.A.prime >> i) & 1; const inKey = (firstKey >> i) & 1;
    s += `<rect x="${xs[i]}" y="${top}" width="${widths[i]}" height="${boxH}" rx="5" fill="${col(prime ? 'var(--prime-soft)' : 'var(--sheet)')}" stroke="${col(prime ? 'var(--prime)' : 'var(--rule)')}" stroke-width="1.2"/>`;
    s += `<text x="${cx(i)}" y="${top + 21.5}" text-anchor="middle" font-size="13" fill="${col('var(--ink)')}">${esc(a)}</text>`;
    if (inKey) s += `<line x1="${cx(i) - a.length * 3.9}" x2="${cx(i) + a.length * 3.9}" y1="${top + 25}" y2="${top + 25}" stroke="${col('var(--ink)')}" stroke-width="1"/>`;
  });
  deps.forEach((d, k) => {
    const y = lvl0 + k * step; const c = col(KIND[d.kind].color); const dash = d.kind === 'mvd' ? ' stroke-dasharray="4 3"' : '';
    const L = NF.bits(d.lhs), Rr = NF.bits(d.rhs & ~d.lhs);
    const off = deps.length > 1 ? ((k % 5) - 2) * 4 : 0; const ox = (i) => cx(i) + off;
    const allX = L.concat(Rr).map(ox); const x1 = Math.min(...allX), x2 = Math.max(...allX);
    s += `<g><title>${esc(R.n.fd(d, d.kind === 'mvd' ? '↠' : '→'))}: ${esc(KIND[d.kind].label)}</title>`;
    s += `<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="2"${dash}/>`;
    L.forEach((i) => { s += `<line x1="${ox(i)}" x2="${ox(i)}" y1="${top + boxH}" y2="${y}" stroke="${c}" stroke-width="2"${dash}/><circle cx="${ox(i)}" cy="${top + boxH + 3}" r="3" fill="${c}"/>`; });
    Rr.forEach((i) => { s += `<line x1="${ox(i)}" x2="${ox(i)}" y1="${y}" y2="${top + boxH + 4}" stroke="${c}" stroke-width="2"${dash} marker-end="url(#ah-${d.kind}${forPrint ? 'p' : ''})"/>`; });
    s += `<text x="${totalW + 10}" y="${y + 4}" font-size="11" fill="${c}">${d.kind === 'bcnf' ? 'key' : d.kind === '3nf' ? 'prime RHS' : d.kind}</text></g>`;
  });
  return s + '</svg>';
}

function labLoad(schema, deps, decomp, tab) {
  LAB.schema = schema; LAB.deps = deps; LAB.decomp = decomp || ''; LAB.closureSel = 0; LAB.chaseStep = null;
  if (tab) LAB.tab = tab;
  store.set('lab.schema', LAB.schema); store.set('lab.deps', LAB.deps); store.set('lab.decomp', LAB.decomp); store.set('lab.tab', LAB.tab);
  if (LAB.built) { $('#in-schema').value = schema; $('#in-deps').value = deps; $('#in-decomp').value = LAB.decomp; }
  if (location.hash !== '#lab') location.hash = '#lab'; else RENDER.lab();
}

function labRun() {
  let R;
  try { R = labCompute(); } catch (e) { R = { error: ['Something in the input could not be processed: ' + e.message] }; }
  const out = $('#lab-out'); const msg = $('#rail-msg');
  if (R.error) {
    msg.innerHTML = R.error.map((e) => `<p class="err"><span aria-hidden="true">!</span>${esc(e)}</p>`).join('');
    if (LAB.result) { out.classList.add('stale'); out.setAttribute('aria-label', 'Results below are from the last valid input'); }
    else out.innerHTML = '<div class="panel empty">Fix the input on the left to see results.</div>';
    return;
  }
  msg.innerHTML = ''; out.classList.remove('stale'); out.removeAttribute('aria-label');
  LAB.result = R;
  if (LAB.closureSel & ~R.all) LAB.closureSel = 0;
  const { n, A } = R;
  $('#rail-facts').innerHTML = `<dt>Attributes</dt><dd>${R.attrs.length}</dd><dt>Keys</dt><dd>${esc(n.list(A.keys))}</dd><dt>Prime</dt><dd>${esc(n.set(A.prime))}</dd><dt>Highest</dt><dd>${A.highest}</dd>`;
  out.innerHTML = labSummary(R) + labTabs(R);
  bindLabTabs(R);
}

function rungs(R) {
  const A = R.A;
  const r = [
    { nf: '1NF', pass: true, note: 'values assumed atomic' },
    { nf: '2NF', pass: A.in2, note: A.in2 ? 'no partial dependency' : 'partial: ' + A.partials.slice(0, 1).map((p) => R.n.fd(p)).join('') },
    { nf: '3NF', pass: A.in3, note: A.in3 ? 'no transitive dependency' : A.in2 ? 'transitive: ' + R.n.fd(A.threeNfViol[0]) : '' },
    { nf: 'BCNF', pass: A.inB, note: A.inB ? 'every determinant a superkey' : A.in3 ? R.n.fd(A.bcnfViol[0]) + ' (lhs not superkey)' : '' },
    { nf: '4NF', pass: A.in4, note: A.in4 ? (R.mvds.length ? 'MVDs all from superkeys' : 'no MVDs declared') : A.inB ? R.n.fd(A.mvdViol[0], '↠') : '' },
    { nf: '5NF', pass: A.fiveNF, note: A.fiveNF ? 'all keys simple (Date–Fagin)' : A.in4 ? 'needs join dependencies to decide' : '' }
  ];
  let failed = false;
  return r.map((x, i) => {
    let cls = 'rung';
    if (x.pass && !failed) cls += ' pass' + (x.nf === A.highest ? ' top' : '');
    else if (!failed) { failed = true; cls += x.nf === '5NF' ? ' na' : ' fail'; }
    else cls += ' na';
    return `<div class="${cls}"><b>${x.nf}</b><span>${esc(x.note)}</span></div>`;
  }).join('');
}

function labSummary(R) {
  const { n, A } = R;
  const why = {
    '1NF': 'it has a partial dependency: part of a candidate key determines a non-prime attribute.',
    '2NF': 'a non-prime attribute depends on something that is not a key (a transitive dependency).',
    '3NF': 'a dependency has a left side that is not a superkey, though its right side is prime.',
    BCNF: 'a declared multivalued dependency comes from a non-superkey.',
    '4NF': 'every determinant is a superkey and no declared MVD violates 4NF. 5NF depends on join dependencies the FDs cannot express.',
    '5NF': 'it is in 3NF and every candidate key is a single attribute, which guarantees 5NF (Date and Fagin, 1992).'
  };
  const lead = A.highest === '5NF' || A.highest === '4NF' ? `${esc(R.name)} is in <strong>${A.highest}</strong>: ${why[A.highest]}` : `${esc(R.name)} is in <strong>${A.highest}</strong> and no higher, because ${why[A.highest]}`;
  return `<div class="plate">
    <div class="plate-head"><h2>Dependency diagram of ${esc(R.name)}</h2><span class="muted small">Underlined: first candidate key · tinted boxes: prime attributes</span></div>
    <div class="diagram">${diagramSVG(R)}</div>
    <div class="legend">${Object.entries(KIND).filter(([k]) => k !== 'mvd' || R.mvds.length).map(([, v]) => `<span><i style="background:${v.color}"></i>${v.label}</span>`).join('')}</div>
  </div>
  <div class="ladder" role="list" aria-label="Normal form ladder">${rungs(R)}</div>
  <p class="verdict">${lead}</p>
  <div class="facts">
    <div class="fact"><span>Candidate keys (${A.keys.length})</span><b>${esc(n.list(A.keys))}</b></div>
    <div class="fact"><span>Prime attributes</span><b>${esc(n.set(A.prime))}</b></div>
    <div class="fact"><span>Non-prime attributes</span><b>${esc(n.set(A.nonprime))}</b></div>
    <div class="fact"><span>Superkeys</span><b class="num">${R.superkeys}</b></div>
    <div class="fact"><span>Minimal cover size</span><b class="num">${R.cover.cover.length} FDs</b></div>
  </div>`;
}

const LAB_TABS = [['nf', 'Normal forms'], ['closure', 'Closure'], ['keys', 'Keys'], ['cover', 'Minimal cover'], ['decompose', 'Decompose'], ['test', 'Test decomposition']];
function labTabs(R) {
  return `<div class="tabs" role="tablist" aria-label="Analysis">${LAB_TABS.map(([id, label]) => `<button role="tab" id="tab-${id}" aria-controls="tp-${id}" aria-selected="${LAB.tab === id}" tabindex="${LAB.tab === id ? 0 : -1}" data-tab="${id}">${label}</button>`).join('')}</div>
  <div class="tabpanel" role="tabpanel" id="tp-${LAB.tab}" aria-labelledby="tab-${LAB.tab}" tabindex="0">${TABVIEW[LAB.tab](R)}</div>`;
}
function bindLabTabs(R) {
  const tabs = $$('#lab-out [role="tab"]');
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => { LAB.tab = t.dataset.tab; store.set('lab.tab', LAB.tab); labRun(); $('#tab-' + LAB.tab).focus(); });
    t.addEventListener('keydown', (e) => {
      let j = null;
      if (e.key === 'ArrowRight') j = (i + 1) % tabs.length; if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
      if (e.key === 'Home') j = 0; if (e.key === 'End') j = tabs.length - 1;
      if (j != null) { e.preventDefault(); tabs[j].click(); }
    });
  });
  if (TABBIND[LAB.tab]) TABBIND[LAB.tab](R);
}

const kindChip = (k) => ({ bcnf: '<span class="chip ok">superkey → ok</span>', '3nf': '<span class="chip prime">prime RHS: 3NF ok, not BCNF</span>', partial: '<span class="chip warn">partial: breaks 2NF</span>', transitive: '<span class="chip bad">transitive: breaks 3NF</span>' }[k]);

const TABVIEW = {
  nf(R) {
    const { n, A } = R;
    const rows = A.rows.map((r) => {
      const c = NF.closure(r.fd.lhs, R.fds);
      return `<tr><td class="fd">${esc(n.fd(r.fd))}</td><td class="set">${esc(n.set(c))}</td><td>${c === R.all ? 'yes' : 'no'}</td><td>${NF.sub(r.fd.rhs, A.prime) ? 'yes' : 'no'}</td><td>${kindChip(r.kind)}</td></tr>`;
    }).join('');
    const partial = A.partials.length ? `<h3>Partial dependencies found</h3><p class="lead">Each proper subset of every candidate key was closed, looking for non-prime attributes it determines on its own.</p>
      <ul class="notes">${A.partials.map((p) => `<li><span class="fd">${esc(n.fd(p))}</span>: ${esc(n.set(p.lhs))} is part of key ${esc(n.set(p.key))}, and ${esc(n.set(p.rhs))} is non-prime.</li>`).join('')}</ul>` : '';
    const mv = R.mvds.length ? `<h3>Multivalued dependencies</h3><ul class="notes">${R.mvds.map((m) => { const bad = A.mvdViol.includes(m); return `<li><span class="fd">${esc(n.fd(m, '↠'))}</span> ${bad ? '<span class="chip bad">violates 4NF</span> left side is not a superkey' : '<span class="chip ok">ok</span> trivial or from a superkey'}</li>`; }).join('')}</ul>` : '';
    return `<h3>Every dependency, tested</h3><p class="lead">Each right side is split into single attributes. A dependency is fine for BCNF when its left side is a superkey; 3NF also accepts a prime right side; 2NF fails when part of a key determines a non-prime attribute.</p>
      <div class="scroll-x"><table class="t"><thead><tr><th>Dependency</th><th>Left side closure</th><th>Superkey?</th><th>RHS prime?</th><th>Verdict</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="muted">No functional dependencies.</td></tr>'}</tbody></table></div>${partial}${mv}`;
  },
  closure(R) {
    const { n, attrs } = R; const sel = LAB.closureSel || (R.A.keys[0] & ~(R.A.keys[0] & (R.A.keys[0] - 1))) || 1;
    LAB.closureSel = sel;
    const t = NF.closure(sel, R.fds, true);
    const steps = t.steps.map((s) => `<li><span><span class="fd">${esc(n.fd(s.fd))}</span> applies because ${esc(n.set(s.fd.lhs))} ⊆ current set, adding <b class="set">${esc(n(s.added))}</b><br><span class="why">now ${esc(n.set(s.result))}</span></span></li>`).join('');
    const isSK = t.mask === R.all; const isKey = R.A.keys.includes(sel);
    return `<h3>Attribute closure</h3><p class="lead">Pick attributes to form X. X⁺ starts as X, then any dependency whose left side is inside the set adds its right side, until nothing changes.</p>
      <div class="picker" role="group" aria-label="Choose attributes for X">${attrs.map((a, i) => `<button type="button" data-bit="${i}" aria-pressed="${(sel >> i) & 1 ? 'true' : 'false'}">${esc(a)}</button>`).join('')}</div>
      <ol class="proof"><li><span>Start with X = <b class="set">${esc(n.set(sel))}</b></span></li>${steps}</ol>
      <div class="result-line">${esc(n.set(sel))}⁺ = ${esc(n.set(t.mask))}</div>
      <p>${isKey ? '<span class="chip ok">candidate key</span> X⁺ is every attribute and no smaller subset does that.' : isSK ? '<span class="chip acc">superkey</span> X⁺ is every attribute, but X is not minimal.' : `<span class="chip line">not a superkey</span> missing ${esc(n.set(R.all & ~t.mask))}.`}</p>`;
  },
  keys(R) {
    const { n, K, A } = R;
    const verify = A.keys.map((k) => {

const TB_STEPS = [['table', 'Table'], ['onenf', 'First normal form'], ['deps', 'Dependencies'], ['diagnose', 'Diagnose'], ['normalize', 'Normalize'], ['sql', 'SQL and export']];

const TB = Object.assign({

function tbSetRaw(name, cols, rows, warn) {

function tbLoadRows(name, cols, rows) { tbSetRaw(name, cols, rows, []); TB.mode = 'grid'; TB.step = 2; tbSave(); if (location.hash !== '#tables') location.hash = '#tables'; else RENDER.tables(); }
const tbSafeName = (s) => (String(s || 'MyTable').replace(/\.[^.]+$/, '').replace(/[^\w]+/g, '_').replace(/^(\d)/, 'T_$1').replace(/^_+|_+$/g, '') || 'MyTable');

/* ---------- the whole pipeline ---------- */
function tbCompute() {
  const raw = TB.raw;
  if (!raw || !raw.cols.length) return { error: 'Load an example, paste a table or upload a file to begin.' };
  if (raw.cols.length < 2) return { error: 'A table needs at least two columns.' };
  if (raw.cols.length > TBL.MAX_COLS + 8) return { error: `This page handles up to ${TBL.MAX_COLS} columns after cleaning; the table has ${raw.cols.length}.` };
  if (!raw.rows.length) return { error: 'The table has a header but no rows. Add at least one row.' };
  if (raw.rows.length > TBL.MAX_ROWS) return { error: `This page handles up to ${TBL.MAX_ROWS} rows; the table has ${raw.rows.length}. Remove rows or split the file.` };

  const multiOn = det.multi.filter((m) => TB.off1.multi[raw.cols[m.col]] !== false).map((m) => ({ col: raw.cols[m.col], sep: TB.sep[raw.cols[m.col]] || m.sep }));

/* ----- step 4: diagnose ----- */
function tbAnomalies(R) {
  const { t, n, R: Rel, D } = R; const out = []; const key = Rel.A.keys[0];
  const bad = R.redund.slice().sort((a, b) => ({ partial: 0, transitive: 1, '3nf': 2 })[a.kind] - ({ partial: 0, transitive: 1, '3nf': 2 })[b.kind]);
  if (!bad.length) return R.mvds.length && !Rel.A.in4 ? [`<li><b>Repeated combinations.</b> Every ${esc(n(R.mvds[0].rhs))} value is paired with every value of the other list, so adding one value means adding several rows.</li>`] : [];
  const f = bad[0].fd; const G = [...(function () { const g = new Map(); t.rows.forEach((r, i) => { const k = JSON.stringify(NF.bits(f.lhs).map((j) => r[j])); if (!g.has(k)) g.set(k, []); g.get(k).push(i); }); return g; })().values()];
  const big = G.find((g) => g.length > 1); const single = G.find((g) => g.length === 1);
  const desc = (i, mask) => NF.bits(mask).map((j) => `${t.cols[j]} = ${TBL.show(t.rows[i][j])}`).join(', ');
  const rhsOne = NF.bits(f.rhs & ~f.lhs)[0];
  if (big) out.push(`<li><b>Update anomaly.</b> Changing the ${esc(t.cols[rhsOne])} for ${esc(desc(big[0], f.lhs))} means editing ${big.length} rows (${big.map((i) => i + 1).join(', ')}). Miss one and the table contradicts itself.</li>`);
  const missing = key & ~f.lhs;
  if (missing) out.push(`<li><b>Insertion anomaly.</b> A new ${esc(n(f.lhs))} with its ${esc(n(f.rhs & ~f.lhs))} cannot be recorded until it also has a ${esc(n(missing))}, because the key ${esc(n.set(key))} cannot be NULL.</li>`);
  if (single) { const i = single[0]; out.push(`<li><b>Deletion anomaly.</b> Deleting row ${i + 1} (${esc(desc(i, key))}) also deletes the only record that ${esc(desc(i, f.lhs))} has ${esc(desc(i, f.rhs & ~f.lhs))}.</li>`); }
  return out;
}
function tbViewDiagnose(R) {
  const { t, n } = R; const kindName = { partial: 'partial dependency', transitive: 'transitive dependency', '3nf': 'non-key determinant (BCNF)' };
  const total = R.cellKind.size; const cells = t.rows.length * t.cols.length;
  const rows = R.redund.map((r) => `<tr><td><span class="fd">${esc(n.fd(r.fd))}</span></td><td><span class="chip ${r.kind === 'partial' ? 'warn' : r.kind === 'transitive' ? 'bad' : 'prime'}">${kindName[r.kind]}</span></td><td class="num">${r.cells}</td></tr>`).join('');
  const an = tbAnomalies(R);
  return labSummary(R.R) + `<h2 style="margin:26px 0 8px;font-size:1.25rem">Redundancy in the data</h2>
    <p class="muted" style="max-width:75ch;margin-bottom:10px">${total ? `${total} of ${cells} cells (${Math.round(total / cells * 100)}%) repeat a fact already stated in an earlier row. Highlighted cells could be deleted without losing information.` : 'No cell repeats a fact through a functional dependency.'}</p>
    ${R.redund.length ? `<div class="scroll-x" style="margin-bottom:12px"><table class="t"><thead><tr><th>Dependency</th><th>Kind</th><th>Repeated cells</th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}
    <div class="legend" style="margin-bottom:8px"><span><i class="sw partial"></i>partial</span><span><i class="sw transitive"></i>transitive</span><span><i class="sw bcnf3"></i>non-key determinant</span></div>
    ${dataTable(t.cols, t.rows, { num: true, limit: 60, cellClass: (i, j) => { const k = R.cellKind.get(i + ':' + j); return k ? 'rd-' + (k === '3nf' ? 'b' : k) : ''; } })}

/* ----- step 5: normalize ----- */
function schemaSVG(R, st) {
  const { t } = R; const T = st.tables; const cw = 7.3, rowH = 21, headH = 30, gapX = 46, gapY = 34, maxW = 980;
  const boxes = T.map((tb) => { const cols = NF.bits(tb.mask); const w = Math.max(tb.name.length * 8.6 + 28, ...cols.map((c) => t.cols[c].length * cw + 46)); return { tb, cols, w: Math.round(w), h: headH + cols.length * rowH + 8 }; });
  // parents sit above the tables that reference them: level = 1 + deepest referenced table
  const level = []; const lv = (i, seen = new Set()) => { if (level[i] != null) return level[i]; if (seen.has(i)) return 0; seen.add(i); const ps = T[i].fks.map((f) => lv(f.ref, seen)); return (level[i] = ps.length ? 1 + Math.max(...ps) : 0); };
  T.forEach((_, i) => lv(i));

  for (let L = 0; L <= maxLv; L++) {
    const row = T.map((_, i) => i).filter((i) => level[i] === L);

const TOPICS = ['Closure & inference', 'Keys', 'Normal forms', 'Minimal cover', 'Decomposition', 'Table instances'];

function fmtSetL(attrs, m) { return '{' + NF.bits(m).map((b) => attrs[b]).join(', ') + '}'; }
function shuffle(arr, rand) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickN(arr, k, rand) { return shuffle(arr, rand).slice(0, k); }

/* Builds an MCQ from a correct string and candidate distractors (deduped, shuffled). Returns null when too few distinct options. */
function mcq(correct, distractors, rand) {
  const uniq = [...new Set(distractors.filter((d) => d !== correct))];

        <fieldset><legend>Difficulty</legend><div class="seg">${[['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard']].map(([v, l]) => `<label><input type="radio" name="level" value="${v}" ${QSET.level === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
          <p class="hint">Easy: 4–5 attributes, 1 mark. Medium: 5–6, 2 marks. Hard: 6–7 attributes, more dependencies.</p></fieldset>
        <fieldset><legend>Questions</legend><div class="seg">${[5, 10, 15, 20].map((v) => `<label><input type="radio" name="count" value="${v}" ${QSET.count === v ? 'checked' : ''}><span>${v}</span></label>`).join('')}</div></fieldset>
        <fieldset><legend>Mode</legend><div class="seg">${[['practice', 'Practice'], ['exam', 'Timed test']].map(([v, l]) => `<label><input type="radio" name="mode" value="${v}" ${QSET.mode === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
          <p class="hint">Practice shows the solution after each answer. Timed test follows GATE marking: −⅓ of the marks for a wrong single-answer question, no negative marks for multi-answer or numerical ones.</p></fieldset>
      </div>
    </div>
    <div class="row"><button class="btn primary" type="submit">Start quiz</button><span class="muted small" id="q-setup-msg" role="status"></span></div>
  </form>
  <aside class="panel pad"><h3>Recent attempts</h3>${hist.length ? `<table class="t" style="margin-top:8px"><tbody>${hist.slice(0, 8).map((h) => `<tr><td>${esc(h.title || (h.mode === 'exam' ? 'Timed test' : 'Practice'))}<div class="small muted">${new Date(h.at).toLocaleDateString()} · ${fmtTime(h.secs)}</div></td><td class="num" style="text-align:right">${h.score}/${h.max}</td></tr>`).join('')}</tbody></table>` : '<p class="muted small" style="margin-top:6px">No attempts yet. Your last twelve scores appear here (stored only in this browser).</p>'}</aside></div>`;
  $('#q-setup').addEventListener('submit', (e) => {
    e.preventDefault(); const f = e.target;
    QSET.topics = $$('input[name="topic"]:checked', f).map((x) => x.value);
    QSET.level = f.level.value; QSET.count = Number(f.count.value); QSET.mode = f.mode.value; store.set('quiz.setup', QSET);
    if (!QSET.topics.length) { $('#q-setup-msg').textContent = 'Choose at least one topic.'; return; }
    const qs = generateQuiz({ topics: QSET.topics, level: QSET.level, count: QSET.count });
    startQuiz(qs, QSET.mode, 'quiz', `${QSET.mode === 'exam' ? 'Timed test' : 'Practice'} · ${QSET.level}`, qs.reduce((s, q) => s + (q.marks === 1 ? 90 : 150), 0));
  });
}

function questionHTML(q, i, state) {
  const src = q.exam ? `<span class="chip acc">${esc(q.exam)} ${q.year}${q.set ? ' ' + esc(q.set) : ''}</span>` : '';
  const body = q.type === 'nat'
    ? `<div style="margin:14px 0"><label class="lbl" for="nat-${esc(state.name)}">Your answer</label><input class="field nat num" id="nat-${esc(state.name)}" inputmode="decimal" value="${esc(state.picked ?? '')}" ${state.revealed ? 'disabled' : ''}></div>`
    : `<div class="opts" role="${q.type === 'msq' ? 'group' : 'radiogroup'}" aria-label="Options">${q.options.map((_, k) => optionHTML(q, k, state)).join('')}</div>`;
  return `<div class="q-meta">${src}<span class="chip line">${esc(q.topic)}</span><span class="chip line">${typeLabel(q.type)}</span><span class="chip line">${q.marks} mark${q.marks > 1 ? 's' : ''}</span></div>
    <p class="q-stem">${esc(q.stem)}</p>${qTableHTML(q)}${body}`;
}
function solutionHTML(q, picked) {
  const c = isCorrect(q, picked);
  return `<div class="solution"><p class="feedback ${c ? 'ok' : 'bad'}">${c ? 'Correct.' : `Not quite. The answer is ${esc(answerText(q))}.`}</p>
    <ul>${q.explain.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>${q.alsoIn ? `<p class="small muted">${esc(q.alsoIn)}</p>` : ''}
    ${q.lab ? `<p class="sol-open"><button class="btn sm" data-openlab="${esc(q.id)}">Open this relation in the lab</button></p>` : q.table ? `<p class="sol-open"><button class="btn sm" data-opentable="${esc(q.id)}">Load this table on the Tables page</button></p>` : ''}</div>`;
}
function bindOptions(container, q, getPicked, setPicked, onChange) {
  $$('.opt', container).forEach((lab) => lab.addEventListener('click', (e) => {
    e.preventDefault(); if (lab.classList.contains('locked')) return;
    const k = Number(lab.dataset.opt); let p = getPicked();
    if (q.type === 'msq') { p = p.includes(k) ? p.filter((x) => x !== k) : p.concat(k).sort(); } else p = k;
    setPicked(p); onChange();
  }));
  const nat = $('input.nat', container); if (nat) nat.addEventListener('input', () => setPicked(nat.value.trim()));
  $$('[data-openlab]', container).forEach((b) => b.addEventListener('click', () => { if (q.lab) labLoad(q.lab.schema, q.lab.deps, q.lab.decomp || '', q.lab.decomp ? 'test' : 'nf'); }));
  $$('[data-opentable]', container).forEach((b) => b.addEventListener('click', () => { if (q.table) tbLoadRows(q.exam ? `${q.exam.replace(/\W+/g, '')}_${q.year}` : 'Instance', q.table.cols, q.table.rows); }));
}

function renderQuizRun(root) {
  const q = QUIZ.qs[QUIZ.i]; const i = QUIZ.i; const exam = QUIZ.mode === 'exam';
  const state = { picked: QUIZ.answers[i], revealed: !exam && QUIZ.revealed[i], name: 'q' + i };
  const answered = (k) => { const a = QUIZ.answers[k]; return Array.isArray(a) ? a.length > 0 : a !== '' && a != null; };
  const practiceScore = QUIZ.qs.reduce((s, qq, k) => s + (QUIZ.revealed[k] ? scoreOf(qq, QUIZ.answers[k]).marks : 0), 0);
  root.innerHTML = `<div class="view-head"><div><h1>${esc(QUIZ.title || 'Quiz')}</h1><p class="muted">Question ${i + 1} of ${QUIZ.qs.length}</p></div>
    <button class="btn" id="q-quit">${exam ? 'Submit test' : 'End practice'}</button></div>
  <div class="quiz-grid"><article class="q-card" id="q-card">${questionHTML(q, i, state)}${state.revealed ? solutionHTML(q, QUIZ.answers[i]) : ''}
    <div class="row" style="margin-top:14px">
      <button class="btn" id="q-prev" ${i === 0 ? 'disabled' : ''}>Previous</button>
      ${exam ? `<button class="btn" id="q-mark">${QUIZ.marked[i] ? 'Unmark review' : 'Mark for review'}</button><button class="btn" id="q-clear">Clear answer</button>` : (!state.revealed ? '<button class="btn primary" id="q-check">Check answer</button>' : '')}
      <button class="btn ${exam || state.revealed ? 'primary' : ''}" id="q-next">${i === QUIZ.qs.length - 1 ? (exam ? 'Submit test' : 'See results') : 'Next'}</button>
    </div></article>
    <aside class="panel pad stack">${exam ? `<div><span class="small muted">Time left</span><div class="timer" id="q-timer">--:--</div></div>` : `<div><span class="small muted">Score so far</span><div class="timer num">${Math.round(practiceScore * 100) / 100}</div></div>`}
      <div class="palette" aria-label="Question palette">${QUIZ.qs.map((_, k) => `<button data-go="${k}" class="${answered(k) ? 'ans' : ''} ${k === i ? 'cur' : ''} ${QUIZ.marked[k] ? 'mark' : ''}" aria-label="Question ${k + 1}${answered(k) ? ', answered' : ''}${QUIZ.marked[k] ? ', marked for review' : ''}">${k + 1}</button>`).join('')}</div>
      <p class="small muted">Blue: answered${exam ? '. Dashed: marked for review.' : '.'}</p></aside></div>`;
  if (exam) tickQuiz();
  const card = $('#q-card');
  bindOptions(card, q, () => QUIZ.answers[i], (p) => (QUIZ.answers[i] = p), () => renderQuizRun(root));
  const go = (k) => { QUIZ.i = k; renderQuizRun(root); $('#q-card').focus?.(); };
  $('#q-prev').addEventListener('click', () => go(i - 1));
  $('#q-next').addEventListener('click', () => (i === QUIZ.qs.length - 1 ? finishQuiz() : go(i + 1)));
  $('#q-quit').addEventListener('click', finishQuiz);
  if ($('#q-check')) $('#q-check').addEventListener('click', () => { if (!answered(i)) { toast('Choose an answer first.'); return; } QUIZ.revealed[i] = true; renderQuizRun(root); });
  if ($('#q-mark')) $('#q-mark').addEventListener('click', () => { QUIZ.marked[i] = !QUIZ.marked[i]; renderQuizRun(root); });
  if ($('#q-clear')) $('#q-clear').addEventListener('click', () => { QUIZ.answers[i] = q.type === 'msq' ? [] : q.type === 'nat' ? '' : null; renderQuizRun(root); });
  $$('[data-go]').forEach((b) => b.addEventListener('click', () => go(Number(b.dataset.go))));
}

function renderQuizDone(root) {
  const res = QUIZ.qs.map((q, i) => scoreOf(q, QUIZ.answers[i]));
  const total = Math.round(res.reduce((s, r) => s + r.marks, 0) * 100) / 100, max = QUIZ.qs.reduce((s, q) => s + q.marks, 0);
  const correct = res.filter((r) => r.correct).length, wrong = res.filter((r) => r.attempted && !r.correct).length;
  const byTopic = {}; QUIZ.qs.forEach((q, i) => { byTopic[q.topic] = byTopic[q.topic] || { n: 0, c: 0 }; byTopic[q.topic].n++; if (res[i].correct) byTopic[q.topic].c++; });
  root.innerHTML = `<div class="view-head"><div><h1>Results</h1><p class="muted">${esc(QUIZ.title)}</p></div>
    <div class="row"><button class="btn" id="q-again">${QUIZ.origin === 'pyq' ? 'Back to PYQs' : 'New quiz'}</button></div></div>
  <div class="split2">
    <div class="panel pad"><span class="small muted">Score</span><div class="score-big num">${total} <span class="muted" style="font-size:1.2rem">/ ${max}</span></div>
      <div class="stat-row" style="margin-top:14px"><div class="stat"><b>${correct}</b><span>correct</span></div><div class="stat"><b>${wrong}</b><span>wrong</span></div><div class="stat"><b>${QUIZ.qs.length - correct - wrong}</b><span>skipped</span></div><div class="stat"><b>${fmtTime(Math.round((QUIZ.end - QUIZ.start) / 1000))}</b><span>time</span></div></div>
      ${QUIZ.mode === 'exam' ? '<p class="small muted" style="margin-top:10px">GATE marking: wrong single-answer questions cost a third of their marks.</p>' : ''}</div>
    <div class="panel pad"><h3 style="margin-bottom:10px">Accuracy by topic</h3><div class="bars">${Object.entries(byTopic).map(([t, v]) => `<div class="bar"><span>${esc(t)}</span><div class="track"><div class="fill" style="width:${Math.round(v.c / v.n * 100)}%"></div></div><span class="num">${v.c}/${v.n}</span></div>`).join('')}</div></div>
  </div>
  <h2 style="margin:24px 0 12px">Review</h2><div class="pyq-list" id="q-review">${QUIZ.qs.map((q, i) => `<article class="q-card" data-i="${i}">${questionHTML(q, i, { picked: QUIZ.answers[i], revealed: true, name: 'r' + i })}
    ${res[i].attempted ? solutionHTML(q, QUIZ.answers[i]) : `<div class="solution"><p class="feedback bad">Not attempted. The answer is ${esc(answerText(q))}.</p><ul>${q.explain.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>${q.lab ? `<p class="sol-open"><button class="btn sm" data-openlab="${esc(q.id)}">Open this relation in the lab</button></p>` : q.table ? `<p class="sol-open"><button class="btn sm" data-opentable="${esc(q.id)}">Load this table on the Tables page</button></p>` : ''}</div>`}</article>`).join('')}</div>`;
  $$('#q-review [data-i]').forEach((card) => { const q = QUIZ.qs[Number(card.dataset.i)]; bindOptions(card, q, () => null, () => {}, () => {}); });
  $('#q-again').addEventListener('click', () => { QUIZ.phase = 'setup'; if (QUIZ.origin === 'pyq') location.hash = '#pyq'; else RENDER.quiz(); });
}

/* ---- app-pyq.js ---- */
/* ===================== PREVIOUS YEAR QUESTIONS ===================== */
const PYQ_TOPICS = ['Closure & inference', 'Keys', 'Normal forms', 'Minimal cover', 'Decomposition', 'Table instances', 'Theory'];
const PYQSTATE = {
  prog: store.get('pyq.progress', {}),
  bm: store.get('pyq.bookmarks', []),
  mark(id, correct) { this.prog[id] = { s: correct ? 'right' : 'wrong', at: Date.now() }; store.set('pyq.progress', this.prog); },
  toggle(id) { this.bm = this.bm.includes(id) ? this.bm.filter((x) => x !== id) : this.bm.concat(id); store.set('pyq.bookmarks', this.bm); }
};
const PYQF = store.get('pyq.filters', { exam: 'all', topics: [], type: 'all', status: 'all', sort: 'new', q: '' });
const PYQUI = {};
PYQ.forEach((q) => { q.marks = q.marks || 1; });

function pyqFiltered() {
  const words = PYQF.q.trim().toLowerCase();
  let list = PYQ.filter((q) => (PYQF.exam === 'all' || q.exam === PYQF.exam)
    && (!PYQF.topics.length || PYQF.topics.includes(q.topic))
    && (PYQF.type === 'all' || q.type === PYQF.type)
    && (PYQF.status === 'all' || (PYQF.status === 'todo' && !PYQSTATE.prog[q.id]) || (PYQF.status === 'wrong' && PYQSTATE.prog[q.id] && PYQSTATE.prog[q.id].s === 'wrong') || (PYQF.status === 'bm' && PYQSTATE.bm.includes(q.id)))
    && (!words || (q.stem + ' ' + q.year + ' ' + q.exam + ' ' + (q.options || []).join(' ')).toLowerCase().includes(words)));
  list = list.slice().sort((a, b) => (PYQF.sort === 'new' ? b.year - a.year : a.year - b.year));
  return list;
}

function matrixSVG() {
  const years = [...new Set(PYQ.map((q) => q.year))].sort((a, b) => a - b);
  const left = 128, colW = 26, rowH = 26, top = 8;
  const W = left + years.length * colW + 8, H = top + PYQ_TOPICS.length * rowH + 30;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Questions per topic and year" font-family="Atkinson Hyperlegible, system-ui, sans-serif">`;
  PYQ_TOPICS.forEach((t, r) => {
    const y = top + r * rowH + rowH / 2;
    s += `<text x="${left - 10}" y="${y + 4}" text-anchor="end" font-size="11.5" fill="var(--ink-2)">${esc(t)}</text>`;
    s += `<line x1="${left}" x2="${W - 8}" y1="${y}" y2="${y}" stroke="var(--rule-2)"/>`;
    years.forEach((yr, c) => {
      const k = PYQ.filter((q) => q.topic === t && q.year === yr).length;
      if (k) s += `<circle cx="${left + c * colW + colW / 2}" cy="${y}" r="${4 + k * 2.5}" fill="var(--accent)" fill-opacity="${0.35 + 0.3 * k}"><title>${esc(t)}, ${yr}: ${k} question${k > 1 ? 's' : ''}</title></circle>`;
    });
  });
  years.forEach((yr, c) => {
    const x = left + c * colW + colW / 2, y = top + PYQ_TOPICS.length * rowH + 14;
    s += `<text x="${x}" y="${y}" text-anchor="middle" font-size="10" fill="var(--ink-3)" transform="rotate(-45 ${x} ${y})">${String(yr).slice(2)}’</text>`;
  });
  return s + '</svg>';
}

RENDER.pyq = function () {
  const root = $('#view-pyq');
  const exams = [...new Set(PYQ.map((q) => q.exam))];
  const right = PYQ.filter((q) => PYQSTATE.prog[q.id] && PYQSTATE.prog[q.id].s === 'right').length;
  const wrong = PYQ.filter((q) => PYQSTATE.prog[q.id] && PYQSTATE.prog[q.id].s === 'wrong').length;
  const years = PYQ.map((q) => q.year);
  root.innerHTML = `<div class="view-head"><div><h1>Previous year questions</h1><p class="muted">${PYQ.length} questions on functional dependencies and normalization from GATE CSE, GATE IT and UGC NET, ${Math.min(...years)}–${Math.max(...years)}. Every computational answer key was re-derived by this lab’s engine, and most questions open straight into the lab.</p></div></div>
  <div class="pyq-top">
    <div class="panel pad"><div class="stat-row">
      <div class="stat"><b>${PYQ.length}</b><span>questions</span></div><div class="stat"><b>${right}</b><span>solved correctly</span></div>
      <div class="stat"><b>${wrong}</b><span>to revisit</span></div><div class="stat"><b>${PYQSTATE.bm.length}</b><span>bookmarked</span></div></div>
      <div class="progress" aria-label="${right} correct and ${wrong} wrong out of ${PYQ.length}"><i style="width:${right / PYQ.length * 100}%;background:var(--ok)"></i><i style="width:${wrong / PYQ.length * 100}%;background:var(--bad)"></i></div>
      <div class="row" style="margin-top:16px"><button class="btn primary" id="pyq-timed">Attempt the filtered set as a timed paper</button><button class="btn ghost" id="pyq-reset">Reset progress</button></div>
      <p class="hint" id="pyq-timed-hint"></p></div>
    <div class="panel pad matrix"><h3 style="font-size:1rem;margin-bottom:4px">Where the marks have come from</h3><p class="small muted" style="margin-bottom:6px">Questions per topic per year in this bank. Bigger dots, more questions.</p>${matrixSVG()}</div>
  </div>
  <div class="panel filters" role="search">
    <select id="f-exam" aria-label="Exam"><option value="all">All exams</option>${exams.map((e) => `<option ${PYQF.exam === e ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>
    <select id="f-type" aria-label="Question type"><option value="all">All types</option><option value="mcq" ${PYQF.type === 'mcq' ? 'selected' : ''}>Single answer</option><option value="msq" ${PYQF.type === 'msq' ? 'selected' : ''}>One or more answers</option><option value="nat" ${PYQF.type === 'nat' ? 'selected' : ''}>Numerical</option></select>
    <select id="f-status" aria-label="Status"><option value="all">Any status</option><option value="todo" ${PYQF.status === 'todo' ? 'selected' : ''}>Not attempted</option><option value="wrong" ${PYQF.status === 'wrong' ? 'selected' : ''}>Got wrong</option><option value="bm" ${PYQF.status === 'bm' ? 'selected' : ''}>Bookmarked</option></select>
    <select id="f-sort" aria-label="Sort"><option value="new" ${PYQF.sort === 'new' ? 'selected' : ''}>Newest first</option><option value="old" ${PYQF.sort === 'old' ? 'selected' : ''}>Oldest first</option></select>
    <input type="search" id="f-q" placeholder="Search questions (press /)" value="${esc(PYQF.q)}" aria-label="Search questions">
    <div class="row" style="width:100%;gap:6px">${PYQ_TOPICS.map((t) => `<button class="tagbtn" data-topic="${esc(t)}" aria-pressed="${PYQF.topics.includes(t)}">${esc(t)}</button>`).join('')}</div>
  </div>
  <p class="small muted" id="pyq-count" role="status" style="margin-bottom:10px"></p>
  <div class="pyq-list" id="pyq-list"></div>`;
  const save = () => { store.set('pyq.filters', PYQF); renderPyqList(); };
  $('#f-exam').addEventListener('change', (e) => { PYQF.exam = e.target.value; save(); });
  $('#f-type').addEventListener('change', (e) => { PYQF.type = e.target.value; save(); });
  $('#f-status').addEventListener('change', (e) => { PYQF.status = e.target.value; save(); });
  $('#f-sort').addEventListener('change', (e) => { PYQF.sort = e.target.value; save(); });
  $('#f-q').addEventListener('input', debounce((e) => { PYQF.q = e.target.value; save(); }, 150));
  $$('[data-topic]').forEach((b) => b.addEventListener('click', () => { const t = b.dataset.topic; PYQF.topics = PYQF.topics.includes(t) ? PYQF.topics.filter((x) => x !== t) : PYQF.topics.concat(t); b.setAttribute('aria-pressed', PYQF.topics.includes(t)); save(); }));
  $('#pyq-timed').addEventListener('click', () => {
    const list = pyqFiltered(); if (!list.length) { toast('No questions match the filters.'); return; }
    const secs = list.reduce((s, q) => s + (q.marks === 1 ? 90 : 180), 0);
    startQuiz(list.map((q) => ({ ...q })), 'exam', 'pyq', `PYQ paper · ${list.length} questions`, secs);
  });
  $('#pyq-reset').addEventListener('click', (e) => {
    if (e.target.dataset.confirm !== '1') { e.target.dataset.confirm = '1'; e.target.textContent = 'Click again to reset'; setTimeout(() => { if (e.target.isConnected) { e.target.dataset.confirm = ''; e.target.textContent = 'Reset progress'; } }, 3000); return; }
    PYQSTATE.prog = {}; store.set('pyq.progress', {}); RENDER.pyq(); toast('Progress cleared');
  });
  renderPyqList();
};

function renderPyqList() {
  const list = pyqFiltered(); const box = $('#pyq-list'); if (!box) return;
  const total = list.reduce((s, q) => s + q.marks, 0);
  $('#pyq-count').textContent = `${list.length} question${list.length === 1 ? '' : 's'} shown, ${total} marks`;
  $('#pyq-timed-hint').textContent = list.length ? `${list.length} questions, about ${Math.round(list.reduce((s, q) => s + (q.marks === 1 ? 1.5 : 3), 0))} minutes, GATE marking.` : '';
  if (!list.length) { box.innerHTML = '<div class="panel empty">No questions match these filters. Clear a filter or the search box.</div>'; return; }
  box.innerHTML = list.map((q) => pyqCard(q)).join('');
  list.forEach((q) => bindPyqCard(q));
}

function pyqCard(q) {
  const ui = PYQUI[q.id] || (PYQUI[q.id] = { picked: q.type === 'msq' ? [] : q.type === 'nat' ? '' : null, revealed: false });
  const p = PYQSTATE.prog[q.id]; const bm = PYQSTATE.bm.includes(q.id);
  const head = `<div class="q-meta"><span class="chip acc">${esc(q.exam)} ${q.year}</span>${q.set ? `<span class="chip line">${esc(q.set)}</span>` : ''}${q.q ? `<span class="chip line">Q${esc(q.q)}</span>` : ''}<span class="chip line">${esc(q.topic)}</span><span class="chip line">${typeLabel(q.type)}</span><span class="chip line">${q.marks} mark${q.marks > 1 ? 's' : ''}</span>
    ${p ? `<span class="chip ${p.s === 'right' ? 'ok' : 'bad'}">${p.s === 'right' ? 'solved' : 'revisit'}</span>` : ''}
    <button class="bm" data-bm="${q.id}" aria-pressed="${bm}" aria-label="${bm ? 'Remove bookmark' : 'Bookmark this question'}"><svg viewBox="0 0 24 24" fill="${bm ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button></div>`;
  const state = { picked: ui.picked, revealed: ui.revealed, name: 'p-' + q.id };
  const body = q.type === 'nat'
    ? `<div style="margin:14px 0"><label class="lbl" for="nat-${q.id}">Your answer</label><input class="field nat num" id="nat-${q.id}" inputmode="decimal" value="${esc(ui.picked ?? '')}" ${ui.revealed ? 'disabled' : ''}></div>`
